<!DOCTYPE html>
<html>
<head>
    <title>Smart QR Library System</title>
    <link rel ="stylesheet" href="style.css">
</head>

<body>

    <h1>Smart QR Library System</h1>
    
    <h2>St.Johns Collage Of Engineering and Technology</h2>

    <h3>College Library</h3>

    <label>Student Name:</label>
    <input type="text" id="studentName">
    <br><br>

    <label>Roll Number:</label>
    <input type="text" id="rollNumber">
    <br><br>

    <label>Book ID:</label>
    <input type="text" id="bookId">
    <br><br>

    <input type="text" id="bookName">
    <br><br>

    <button onclick="issueBook()">Issue Book</button>
    <button onclick="returnBook()">Return Book</button>

    <script src="script.js"></script>

</body>
</html>
